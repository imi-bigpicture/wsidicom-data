[project]
name = "wsidicom-data"
version = "0.3.0"
description = "Test data for wsidicom"
authors = [
    {name = "Erik O Gabrielsson", email = "erik.o.gabrielsson@sectra.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wsidicom>=0.17.0",
]

[project.optional-dependencies]
imagecodecs = ["imagecodecs>=2024.1.1"]
rle = ["pylibjpeg-rle>=1.3.0"]

[dependency-groups]
dev = [
    "pytest>=7.2.0,<10.0.0",
    "ruff>=0.15.14",
    "pyright>=1.1.409",
    "pytest-testmon>=2.2.0",
    "pytest-watcher>=0.6.3",
    "typos>=1.48.0",
]

[project.urls]
Repository = "https://github.com/imi-bigpicture/wsidicom-data"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes (replaces the old flake8 dep)
# I: import sorting, UP: pyupgrade, B: bugbear, SIM: simplify
# S: flake8-bandit security rules (the free SAST baseline)
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
# S101: asserts are used throughout for type narrowing and internal invariants.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use hardcoded credentials (S105/S106), pseudo-random test
# data (S311), md5 for image-hash comparison (S324), file handles whose lifetime
# is managed by a fixture/wrapper rather than a context manager (SIM115), and long
# lines from embedded test data such as base64 blobs, URLs, and checksums (E501).
"tests/**" = ["S105", "S106", "S311", "S324", "SIM115", "E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wsidicom_data"]

[tool.typos.files]
# The package ships binary encoded test images that trip false positives.
extend-exclude = ["wsidicom_data/data/"]

[tool.pytest-watcher]
now = true
runner = "pytest"
runner_args = ["--testmon"]
ignore_patterns = [".venv/*"]
